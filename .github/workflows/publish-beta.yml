name: Publish signed Android beta
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check signing credentials
        env:
          KEYSTORE: ${{ secrets.DARTVISION_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARTVISION_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARTVISION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARTVISION_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "::error::Missing DARTVISION_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing DARTVISION_STORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing DARTVISION_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing DARTVISION_KEY_PASSWORD repository secret" && exit 1)
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dartvision-upload.jks"
      - name: Run tests and build signed release APK
        env:
          DARTVISION_KEYSTORE_PATH: ${{ runner.temp }}/dartvision-upload.jks
          DARTVISION_STORE_PASSWORD: ${{ secrets.DARTVISION_STORE_PASSWORD }}
          DARTVISION_KEY_ALIAS: ${{ secrets.DARTVISION_KEY_ALIAS }}
          DARTVISION_KEY_PASSWORD: ${{ secrets.DARTVISION_KEY_PASSWORD }}
        run: |
          gradle -p android testDebugUnitTest assembleRelease --stacktrace
      - name: Prepare stable APK filename
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/dart-vision.apk
      - name: Calculate release checksum and version
        id: release
        run: |
          APK="android/app/build/outputs/apk/release/dart-vision.apk"
          sha256sum "$APK" | awk '{print "sha256="$1}' >> "$GITHUB_OUTPUT"
          echo "version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DART VISION ${{ steps.release.outputs.version_name }}
          files: android/app/build/outputs/apk/release/dart-vision.apk
          generate_release_notes: true
      - uses: actions/checkout@v4
        with:
          ref: main
          path: manifest-repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update in-app update manifest
        working-directory: manifest-repo
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          cat > latest.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/benjaminphilippot34-star/-DART-VISION/releases/latest/download/dart-vision.apk",
            "sha256": "$SHA256"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish DART VISION $VERSION_NAME update manifest"
          git push origin HEAD:main
