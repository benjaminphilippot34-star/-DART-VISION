name: Android build and tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build debug APK
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace
      - name: Publish installable debug APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: dart-vision-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14
