name: Android build, tests and signed release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DARTVISION_KEYSTORE_BASE64: ${{ secrets.DARTVISION_KEYSTORE_BASE64 }}
      DARTVISION_STORE_PASSWORD: ${{ secrets.DARTVISION_STORE_PASSWORD }}
      DARTVISION_KEY_ALIAS: ${{ secrets.DARTVISION_KEY_ALIAS }}
      DARTVISION_KEY_PASSWORD: ${{ secrets.DARTVISION_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace

      - name: Publish debug APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: dart-vision-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14

      - name: Check signing secrets
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          missing=0
          for name in DARTVISION_KEYSTORE_BASE64 DARTVISION_STORE_PASSWORD DARTVISION_KEY_ALIAS DARTVISION_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode and validate release keystore
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          printf '%s' "$DARTVISION_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/dartvision-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/android/app/dartvision-release.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/android/app/dartvision-release.jks" -storepass "$DARTVISION_STORE_PASSWORD" -alias "$DARTVISION_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DARTVISION_KEYSTORE_PATH: ${{ github.workspace }}/android/app/dartvision-release.jks
        run: gradle -p android assembleRelease --stacktrace

      - name: Verify release APK signature
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk | tee android/app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Publish signed release artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: dart-vision-signed-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/app-release.apk#dart-vision.apk --clobber
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk#dart-vision.apk \
              --title "DART VISION $VERSION_NAME" \
              --notes "Mode normal ou caméra au choix. Mise à jour intégrée à l'application."
          fi

      - name: Update in-app update manifest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const gradle = fs.readFileSync('android/app/build.gradle.kts', 'utf8');
            const versionCode = Number(gradle.match(/versionCode = (\d+)/)?.[1]);
            const versionName = gradle.match(/versionName = \"([^\"]+)\"/)?.[1];
            if (!versionCode || !versionName) throw new Error('Unable to read Android version from build.gradle.kts');
            const apk = fs.readFileSync('android/app/build/outputs/apk/release/app-release.apk');
            const sha256 = crypto.createHash('sha256').update(apk).digest('hex');
            const path = 'latest.json';
            const apkUrl = 'https://github.com/benjaminphilippot34-star/-DART-VISION/releases/download/v' + versionName + '/app-release.apk';
            const content = JSON.stringify({ versionCode, versionName, apkUrl, sha256 }, null, 2) + "\n";
            let published = false;
            for (let attempt = 1; attempt <= 5; attempt++) {
              let currentSha;
              let currentManifest = null;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo, path
                });
                currentSha = current.data.sha;
                if (current.data.content) {
                  currentManifest = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (currentManifest && Number(currentManifest.versionCode) > versionCode) {
                core.info('A newer APK is already published in latest.json; refusing to replace it with an older build.');
                published = true;
                break;
              }
              if (currentManifest &&
                  Number(currentManifest.versionCode) === versionCode &&
                  currentManifest.versionName === versionName &&
                  currentManifest.apkUrl === apkUrl &&
                  currentManifest.sha256 === sha256) {
                core.info('latest.json already matches this signed APK; no update is needed.');
                published = true;
                break;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  message: 'Publish DART VISION ' + versionName + ' update manifest',
                  content: Buffer.from(content).toString('base64'),
                  ...(currentSha ? { sha: currentSha } : {})
                });
                published = true;
                break;
              } catch (error) {
                if (![409, 422].includes(error.status) || attempt === 5) throw error;
                core.warning('latest.json changed during publication; retrying with its newest SHA (attempt ' + (attempt + 1) + ').');
                await new Promise(resolve => setTimeout(resolve, attempt * 1000));
              }
            }
            if (!published) throw new Error('Unable to publish a coherent latest.json after retries.');

      - name: Remove temporary signing keystore
        if: ${{ always() }}
        run: rm -f android/app/dartvision-release.jks
